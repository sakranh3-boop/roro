<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הכסף שלנו</title>
<meta name="theme-color" content="#0F6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הכסף שלנו">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Layout: fixed-width phone column; gradient header with mode switch; one "live" card overlapping the header; sections of cards below; bottom tab bar with a raised + button. */
:root{
  --bg:#EEF3F1;--surface:#FFFFFF;--surface2:#F3F7F5;--ink:#0E1F1A;--ink2:#5A6E67;--line:#DCE5E1;
  --brand:#0B6B4F;--brand2:#139C76;--brand3:#1FC08F;--hero1:#0A3D34;--hero2:#0F6B57;--hero3:#19A47E;
  --coin:#FFB020;--coin-ink:#3B2600;--bad:#D7263D;--bad-bg:#FBE7EA;--good:#13875F;--good-bg:#E2F5EC;--warn:#A05A00;--warn-bg:#FFF1D6;--info:#2563EB;
  --water:#139C76;--water2:#8FE3C7;--deep:#0B6B4F;--leak:#D7263D;--leak-bg:#FBE7EA;--ok:#13875F;--ok-bg:#E2F5EC;
  --shadow:0 1px 2px rgba(14,31,26,.05),0 10px 30px rgba(14,31,26,.07);
  --tab-h:66px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0B1411;--surface:#132019;--surface2:#0F1A15;--ink:#E7F2ED;--ink2:#97ACA3;--line:#243630;
  --brand:#19A47E;--brand2:#2BC592;--brand3:#5EE2B6;--hero1:#08201B;--hero2:#0B3A30;--hero3:#0F5C48;
  --coin:#FFB83D;--bad:#FF6B7D;--bad-bg:#3A1A20;--good:#4ED39B;--good-bg:#12362A;--warn:#F2B35A;--warn-bg:#3A2A10;--info:#7FA8FF;
  --water:#2BC592;--water2:#5EE2B6;--deep:#19A47E;--leak:#FF6B7D;--leak-bg:#3A1A20;--ok:#4ED39B;--ok-bg:#12362A;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik","Heebo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:46px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--brand3);outline-offset:1px}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3,p{margin:0}
.lnk{text-decoration:underline;font-weight:600;color:var(--brand)}

#app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(var(--tab-h) + 28px + env(safe-area-inset-bottom))}
#view{display:block}

/* tab bar */
#tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
#tabs .tbar{pointer-events:auto;width:min(560px,100%);height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;box-shadow:0 -6px 24px rgba(14,31,26,.06)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--ink2);height:var(--tab-h);justify-content:center;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--brand);font-weight:600}
.tab[aria-current=page]::after{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
#fab{width:64px;height:64px;border-radius:22px;background:var(--coin);color:var(--coin-ink);justify-self:center;margin-top:-30px;box-shadow:0 8px 20px rgba(255,176,32,.5),0 0 0 6px var(--bg);display:grid;place-items:center;transition:transform .15s;transform:rotate(45deg)}
#fab svg{width:30px;height:30px;stroke:currentColor;stroke-width:3;stroke-linecap:round;fill:none;transform:rotate(-45deg)}
#fab:active{transform:rotate(45deg) scale(.93)}

/* hero */
.hero{background:radial-gradient(120% 90% at 100% 0%,var(--hero3) 0%,transparent 55%),linear-gradient(165deg,var(--hero1),var(--hero2) 75%);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 70px;border-radius:0 0 30px 30px}
.hero .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
.hero .hi{font-size:22px;font-weight:700}
.hero .cyc{font-size:13px;opacity:.85;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:0 14px;font-size:13px;min-height:40px;white-space:nowrap}
.modeSeg{margin-top:14px;background:rgba(0,0,0,.22);border-color:transparent}
.modeSeg button{color:rgba(255,255,255,.8)}
.modeSeg button[aria-pressed=true]{background:#fff;color:var(--hero2)}
.liveCard{margin:-54px 14px 0;background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:16px 14px 12px;position:relative}
.liveTop{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.liveStats .kv{padding:5px 0;font-size:14px}
.liveStats .kv b{font-size:15px}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:13}
.ring-fg{fill:none;stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 18px}
.ring-txt b{font-size:22px;font-weight:700;line-height:1.05;letter-spacing:-.4px}
.ring-txt span{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.2}
.ring-txt small{font-size:11px;color:var(--ink2);margin-top:2px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:84px;align-items:end;margin-top:12px;direction:rtl}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.day i{display:block;width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--brand2);transition:height .4s}
.day.today i{background:var(--coin)}
.day.future i{background:var(--line)}
.day span{font-size:11px;color:var(--ink2)}
.day small{font-size:10px;color:var(--ink2);height:12px;line-height:12px}
.day.today span{color:var(--ink);font-weight:700}

/* quick tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:10px 4px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;border-bottom:3px solid var(--c,var(--line));line-height:1.15;text-align:center}
.tile span{font-size:26px;line-height:1.1}
.tile:active{transform:scale(.96)}

/* where did it go */
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface2);direction:rtl}
.stack i{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px}
.legend button{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;min-height:34px}
.legend button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{font-weight:600}
.whyCard{width:100%;text-align:start;display:block}
.whyCard .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.whyTitle{font-size:17px;font-weight:600}
.whyAmt{text-align:end}
.whyAmt .num{font-size:22px;font-weight:700}
.whyAmt small{display:block;font-size:12px;color:var(--ink2)}
.whyBig{margin-top:10px;padding:9px 11px;background:var(--surface2);border-radius:12px;font-size:13.5px}
.card.tap{width:100%;text-align:start;display:block}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface2);border-radius:16px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:600}
.stat span{font-size:12.5px;color:var(--ink2)}
.verdict{margin:12px 2px 0;padding:10px 14px;border-radius:14px;font-size:14.5px;display:flex;gap:10px;align-items:center}
.verdict.good{background:var(--good-bg);color:var(--good)}
.verdict.mid{background:var(--warn-bg);color:var(--warn)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}

.sec{padding:18px 16px 0}
.sec>h2{font-size:17px;font-weight:600;margin-bottom:10px}
.sec>.sub{font-size:13.5px;color:var(--ink2);margin:-6px 0 10px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px}
.card+.card{margin-top:10px}
.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:start;border-bottom:1px solid var(--line);min-height:56px}
.item:last-child{border-bottom:0}
.item:active{background:var(--surface2)}
.item .ico{width:40px;height:40px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font-size:20px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--ink2);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:600;white-space:nowrap}
.item .a.in{color:var(--good)}
.item input[type=checkbox]{width:28px;height:28px;margin:8px}
.chev{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:600;background:var(--brand);color:#fff}
.btn.coin{background:var(--coin);color:var(--coin-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row2{display:flex;gap:10px;align-items:center}
.row2>*{flex:1}
.mt{margin-top:12px}.mt2{margin-top:20px}

/* leak cards */
.holeHero{background:linear-gradient(160deg,#9E1B2F,#C8253E 70%,#E04A5F);color:#fff;border-radius:24px;padding:18px 18px 16px;box-shadow:0 12px 30px rgba(200,37,62,.28);position:relative;overflow:hidden;width:100%;text-align:start;display:block}
.holeHero::after{content:"";position:absolute;inset-inline-end:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1)}
.holeHero small{font-size:13px}
.holeHero .big{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin:4px 0}
.holeHero h2{font-size:19px;font-weight:600}
.holeHero p{font-size:14px;margin-top:6px}
.leak{border-radius:18px;background:var(--surface);box-shadow:var(--shadow);padding:14px 16px;border-inline-start:5px solid var(--bad);margin-bottom:10px}
.leak.struct{border-inline-start-color:var(--warn)}
.leak.info{border-inline-start-color:var(--brand2)}
.leak .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.leak h3{font-size:16px;font-weight:600}
.leak .y{font-weight:700;color:var(--bad);white-space:nowrap}
.leak.struct .y{color:var(--warn)}
.leak p{font-size:14px;color:var(--ink2);margin-top:5px}
.leak .act{margin-top:8px;font-size:14px;background:var(--surface2);border-radius:11px;padding:8px 11px}
.empty{text-align:center;color:var(--ink2);padding:26px 16px}
.empty .big{font-size:40px}
.seg{display:flex;background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-size:14.5px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface2);border-radius:99px;padding:8px 14px;font-size:14.5px;min-height:44px;display:inline-flex;align-items:center}
.chip.sm{min-height:36px;padding:4px 12px;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand2)}
.barRow{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;font-size:13.5px;margin:7px 0}
.barRow .v{text-align:end;font-weight:500}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:15px;gap:8px}
.kv+.kv{border-top:1px dashed var(--line)}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2)}
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:16px;background:var(--warn-bg);color:var(--warn);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner button{margin-inline-start:auto;font-weight:600;text-decoration:underline;white-space:nowrap;min-height:44px;padding:0 10px}
.banner.info{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.banner.install{background:linear-gradient(135deg,var(--hero2),var(--hero3));color:#fff;align-items:center}
.banner.install button{background:#fff;color:var(--hero2);text-decoration:none;border-radius:12px;padding:0 16px}

/* sheet */
.ov{position:fixed;inset:0;z-index:90;background:rgba(5,20,15,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:min(560px,100%);max-height:94dvh;border-radius:26px 26px 0 0;overflow:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.sheet.full{height:94dvh}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:19px;font-weight:600;margin:4px 0 12px;display:flex;align-items:center;justify-content:space-between}
.x{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:20px;color:var(--ink2)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.amtShow{text-align:center;font-size:44px;font-weight:700;letter-spacing:-1px;padding:2px 0;min-height:60px}
.amtShow small{font-size:22px;color:var(--ink2);font-weight:500}
.hint{text-align:center;font-size:13px;color:var(--ink2);min-height:19px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px;direction:ltr}
.pad button{height:48px;border-radius:15px;background:var(--surface);box-shadow:var(--shadow);font-size:24px;font-weight:500}
.pad button:active{background:var(--surface2)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{background:var(--surface);border:2px solid transparent;border-radius:15px;padding:9px 2px 7px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);min-height:62px;line-height:1.15;text-align:center}
.cat span{font-size:23px;line-height:1.2}
.cat[aria-pressed=true]{border-color:var(--brand);background:var(--surface2);font-weight:600}
.lbl{font-size:13px;color:var(--ink2);margin:14px 0 6px}
.saveBar{position:sticky;bottom:-18px;margin:0 -16px;padding:10px 16px 6px;background:var(--bg);border-top:1px solid var(--line)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
.toast{position:fixed;z-index:80;inset-inline:0;bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
.toast>div{pointer-events:auto;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14.5px;display:flex;gap:14px;align-items:center;animation:up .2s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{font-weight:700;color:var(--coin);text-decoration:underline;min-height:44px;padding:0 10px}
.onb{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:calc(24px + env(safe-area-inset-top)) 20px 30px}
.onb .inner{max-width:480px;margin:0 auto}
.onb h1{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:10px 0 6px}
.onb p.lead{color:var(--ink2);margin-bottom:18px}
.obLogo{width:72px;height:72px;border-radius:22px;background:linear-gradient(160deg,var(--hero2),var(--hero3));color:#fff;font-size:40px;font-weight:700;display:grid;place-items:center;box-shadow:var(--shadow)}
.dots{display:flex;gap:6px;margin-bottom:6px}
.dots i{height:5px;flex:1;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--brand)}
.fx{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.sheet,.ov,.toast>div{animation:none}.ring-fg,.day i{transition:none}}
.bubble{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px}
details.fold{margin-top:10px}
details.fold summary{cursor:pointer;font-weight:500;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
details.fold summary::-webkit-details-marker{display:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw input[type=checkbox]{width:24px;height:24px;min-height:0}
.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{font-size:13px;color:var(--ink2)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:6px 4px;text-align:start;border-bottom:1px solid var(--line)}
.card.hl{border:2px solid var(--brand)}
@media (max-height:760px){
  .pad{gap:6px;margin:4px 0 8px}.pad button{height:40px;font-size:22px}
  .amtShow{font-size:36px;min-height:46px}.hint{min-height:0;font-size:12px}
  .cat{min-height:54px;padding:6px 2px}
}
@media (max-width:360px){.liveTop{grid-template-columns:130px 1fr}.ring{width:130px;height:130px}.ring-txt b{font-size:19px}}
@keyframes pulse{50%{transform:rotate(45deg) scale(1.1)}}
#fab.pulse{animation:pulse 1.4s 3}
/* iOS install overlay */
.iosHint{position:fixed;inset-inline:16px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:95;background:var(--surface);color:var(--ink);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.3);padding:14px 16px 16px;font-size:14.5px;animation:up .3s}
.iosHint::after{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:var(--surface);border-bottom:0}
.iosHint b{display:block;font-size:16px;margin-bottom:6px}
.iosHint .x{position:absolute;top:8px;inset-inline-end:8px;width:36px;height:36px}
.iosHint .shareIco{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin:0 3px}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<nav id="tabs" aria-label="ניווט ראשי"></nav>
<div id="toast" class="toast" aria-live="polite"></div>
<noscript>האפליקציה צריכה JavaScript כדי לעבוד.</noscript>
<script>
const ART=false;
'use strict';
/* ================= helpers ================= */

function cashStats(key, ws) {
  let inRange;
  if (ws) { const we = addD(ws, 7); inRange = t => t.date >= ws && t.date < we; }
  else { const end = key ? cycleEnd(key) : null; inRange = t => !key || (t.date >= key && t.date < end); }
  const all = txLive();
  const wd = all.filter(t => t.cat === 'cash'), sp = all.filter(t => t.method === 'cash' && t.cat !== 'cash' && t.cat !== 'handover'), hd = all.filter(t => t.cat === 'handover');
  const wdC = wd.filter(inRange), spC = sp.filter(inRange), hdC = hd.filter(inRange);
  const by = [0, 0, 0], toBy = [0, 0, 0]; for (const t of wdC) { by[t.who] += t.amt; toBy[t.holder == null ? t.who : t.holder] += t.amt; }
  const wallet = [0, 0, 0]; for (const t of wd) wallet[t.holder == null ? t.who : t.holder] += t.amt; for (const t of sp) wallet[t.who] -= t.amt; for (const t of hd) { wallet[t.who] -= t.amt; wallet[t.holder == null ? t.who : t.holder] += t.amt; }
  const given = [0, 0, 0], got = [0, 0, 0]; for (const t of hdC) { given[t.who] += t.amt; got[t.holder == null ? t.who : t.holder] += t.amt; }
  const wdSum = sum(wdC.map(t => t.amt)), spSum = sum(spC.map(t => t.amt));
  return { wdC, spC, hdC, by, toBy, given, got, wdSum, spSum, hdSum: sum(hdC.map(t => t.amt)), wallet, gap: Math.max(0, wdSum - spSum) };
}

    if (R() < .05 * spike) add(d, ri(120, 420), 'clothes', pick([0, 1]), 'card', '');
    if (R() < .07 * spike) add(d, ri(60, 300), 'home', 2, 'card', '');

function paceChart(c, p) {
  const W = 320, Hh = 110, pad = 6, n = c.days;

  const daily = new Array(n).fill(0);
  for (const t of c.varTx) { const d = diffD(c.key, t.date); if (d >= 0 && d < n) daily[d] += t.amt; }
  let acc = 0; const pts = [];
  for (let i = 0; i < p.el; i++) { acc += daily[i]; pts.push([i, acc]); }
  const maxY = Math.max(c.budget, acc) * 1.05;
  const X = i => pad + (i / (n - 1)) * (W - pad * 2), Y = v => Hh - pad - (v / maxY) * (Hh - pad * 2);
  const line = pts.map(([i, v], k) => `${k ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const proj = p.el >= 7 ? acc / p.el * n : null;
  const over = proj != null && proj > c.budget;
  const area = pts.length ? line + ` L${X(pts[pts.length - 1][0]).toFixed(1)} ${Y(0)} L${X(0)} ${Y(0)} Z` : '';

  openSheet(`<h2>אייקון במסך הבית<button class="x" data-act="closesheet" aria-label="סגירה">×</button></h2>

/* ---------- onboarding ---------- */
let OB = null;
function startOnboarding() {
  OB = { step: 0, n0: 'חמזה', n1: 'רורו', me: 0, payday: 10, i0: '', i1: '', fx: {} };
  drawOnb();
}
const OB_FIX = [['שכר דירה / משכנתא', 'housing'], ['ארנונה', 'bills'], ['חשמל', 'bills'], ['מים וגז', 'bills'], ['אינטרנט וטלוויזיה', 'comms'], ['סלולר', 'comms'], ['ביטוחים', 'insur'], ['צהרון / גן', 'edu'], ['החזר הלוואה / רכב', 'loan']];
function drawOnb() {
  { const tt = $('#toast'); if (tt) tt.innerHTML = ''; }
  let ov = $('#onb'); if (!ov) { ov = document.createElement('div'); ov.id = 'onb'; ov.className = 'onb'; document.body.appendChild(ov); document.body.style.overflow = 'hidden'; }
  const dots = `<div class="dots">${[0, 1, 2, 3].map(i => `<i class="${i <= OB.step ? 'on' : ''}"></i>`).join('')}</div>`;
  let b = '';
  if (OB.step === 0) b = `<div class="obLogo">₪</div><h1>הכסף שלנו</h1><p class="lead">דשבורד חי לשניכם. רושמים הוצאה ב־5 שניות, רואים כמה נשאר מדמי השבוע ועד המשכורת, ואיפה הכסף הולך ולמה.</p>
   <div class="row2"><div class="field"><label>שם 1</label><input id="ob0" value="${esc(OB.n0)}" placeholder="חמזה"></div><div class="field"><label>שם 2</label><input id="ob1" value="${esc(OB.n1)}" placeholder="רורו"></div></div>
   <div class="lbl">הטלפון הזה של</div><div class="seg"><button aria-pressed="${OB.me === 0}" data-act="obme" data-v="0">${esc(OB.n0 || 'שם 1')}</button><button aria-pressed="${OB.me === 1}" data-act="obme" data-v="1">${esc(OB.n1 || 'שם 2')}</button></div>`;
  if (OB.step === 1) b = `<h1>הכנסות</h1><p class="lead">המשכורות נטו (אחרי מס). אפשר לעדכן בכל רגע.</p>
   <div class="field"><label>${esc(OB.n0 || 'אני')}</label><input id="obi0" type="number" inputmode="decimal" value="${OB.i0}" placeholder="₪ בחודש"></div><div class="field"><label>${esc(OB.n1 || 'בן/בת הזוג')}</label><input id="obi1" type="number" inputmode="decimal" value="${OB.i1}" placeholder="₪ בחודש"></div>
   <div class="field"><label>באיזה יום בחודש נכנסת המשכורת?</label><select id="obp">${Array.from({ length: 28 }, (_, i) => i + 1).map(d => `<option ${d === OB.payday ? 'selected' : ''}>${d}</option>`).join('')}</select><p class="mini mt">החודש שלכם נספר מיום המשכורת ועד שלפני המשכורת הבאה, כי שם הכסף באמת מתחיל ונגמר.</p></div>`;
  if (OB.step === 2) b = `<h1>הוצאות קבועות</h1><p class="lead">רק מה שחוזר כל חודש. מה שלא רלוונטי משאירים ריק.</p>${OB_FIX.map(([n], i) => `<div class="fx"><span>${n}</span><input type="number" inputmode="decimal" data-fx="${i}" value="${OB.fx[i] || ''}" placeholder="₪"></div>`).join('')}`;
  if (OB.step === 3) b = `<div style="font-size:64px">✅</div><h1>הכל מוכן</h1><p class="lead">אחרי "מתחילים" תמצאו למטה כפתור צהוב עם +. כל הוצאה נרשמת ממנו, 5 שניות. אחרי כשבוע של תיעוד יתחיל להופיע החור הגדול.</p><div class="card"><b>טיפ אחד:</b> רשמו מיד אחרי הקנייה, בתור לקופה. 5 שניות.</div>`;
  const last = OB.step === 3;

}
function obCollect() {
  if (OB.step === 0) { OB.n0 = $('#ob0').value.trim(); OB.n1 = $('#ob1').value.trim(); }
  if (OB.step === 1) { OB.i0 = $('#obi0').value; OB.i1 = $('#obi1').value; OB.payday = +$('#obp').value; }
  if (OB.step === 2) $$('[data-fx]').forEach(el => OB.fx[el.dataset.fx] = el.value);
}
function finishOnboarding(demo) {
  const st = nowISO(), n0 = OB.n0 || 'אני', n1 = OB.n1 || 'בן/בת הזוג';
  S.settings.names = [n0, n1]; S.settings.me = OB.me; S.lastUsed.who = OB.me; S.settings.payday = OB.payday; S.settings.updatedAt = st;
  if (+OB.i0 > 0) S.incomes.push({ id: uid(), name: 'משכורת ' + n0, amount: +OB.i0, who: 0, updatedAt: st });
  if (+OB.i1 > 0) S.incomes.push({ id: uid(), name: 'משכורת ' + n1, amount: +OB.i1, who: 1, updatedAt: st });
  OB_FIX.forEach(([n, c], i) => { const v = +OB.fx[i]; if (v > 0) S.fixed.push({ id: uid(), name: n, amount: v, cat: c, who: 2, sub: false, active: true, updatedAt: st }); });
  S.onboarded = true; if (demo) makeDemo(); save();
  $('#onb').remove(); document.body.style.overflow = ''; OB = null; go('home'); { const f = $('#fab'); if (f) f.classList.add('pulse'); }
}

/* ================= event wiring ================= */
const ACT = {
  ...(typeof ACT_PRE === 'object' ? ACT_PRE : {}),
  pinwipe: (...a) => ACT_LATE.pinwipe(...a), pincancel: (...a) => ACT_LATE.pincancel(...a),
  add: () => openAdd(), closesheet: () => closeSheet(),
  key: el => { const k = el.dataset.k; let a = D.amt; if (k === '⌫') a = a.slice(0, -1); else if (k === '.') { if (!a.includes('.')) a = (a || '0') + '.'; } else { if (a === '0') a = ''; if (a.replace('.', '').length < 8 && !/\.\d\d$/.test(a)) a += k; } D.amt = a; drawAdd(); buzz(); if (a.length === 1 && !D.cat) { const el = $('.cats'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } },
  cat: el => { D.cat = el.dataset.id; if (D.cat === 'cash') { D.method = 'bank'; if (D.holder == null) D.holder = me(); } drawAdd(); },
  addcat: el => { const d = newDraft(); d.cat = el.dataset.cat; d.who = me(); D = d; openSheet('<div id="addbody"></div>', { full: true }); drawAdd(); },
  mode: el => setMode(el.dataset.v), why: el => { WHY = { cat: el.dataset.cat, mode: MODE, ref: MODE === 'week' ? weekStart() : curKey() }; go('more', 'why'); },
  whoami: () => openWhoAmI(),
  who: el => { D.who = +el.dataset.v; if (D.cat === 'cash' && D.holder == null) D.holder = D.who; drawAdd(); }, holder: el => { D.holder = +el.dataset.v; drawAdd(); }, why1: el => { D.why = D.why === el.dataset.v ? '' : el.dataset.v; drawAdd(); }, method: el => { D.method = el.dataset.v; drawAdd(); },
  yday: () => { D.date = addD(today(), -1); D.more = true; drawAdd(); },
  savetx: () => {
    const wasNew = !D.id;
    const split = D.cat === 'cash' && !D.id && (D.holder === 0 || D.holder === 1) ? Math.round((parseFloat(D.split) || 0) * 100) / 100 : 0;
    const total = parseFloat(D.amt) || 0;
    if (split > 0 && split <= total) { const other = 1 - D.holder; const r1 = saveTx({ ...D, id: null }); const at = nowISO(); S.tx.push({ id: uid(), date: r1.t.date, amt: split, cat: 'handover', who: D.holder, holder: other, method: 'cash', note: 'מתוך המשיכה', why: '', inst: 0, talked: false, at, updatedAt: at }); save(); closeSheet(); render(); toast(`נרשמה משיכה של ${moneyT(total)}, ומסירה של ${moneyT(split)} מ${whoName(D.holder)} ל${whoName(other)}`); return; }
    const r = saveTx(); if (!r) return;
    closeSheet(); render();
    const big = r.t.amt >= S.settings.approve && !r.t.talked;
    toast(`נרשם ${moneyT(r.t.amt)}${big && wasNew ? ' · הוצאה גדולה, כדאי לדבר עליה' : ''}`, wasNew ? () => { const i = S.tx.findIndex(x => x.id === r.t.id); if (i >= 0) S.tx[i] = { ...S.tx[i], deleted: true, updatedAt: nowISO() }; save(); render(); } : null);
  },
  deltx: () => deleteTx(D.id),
  quick: el => { const q = quickCombos()[+el.dataset.i]; if (!q) return; const r = saveTx({ amt: String(q.amt), cat: q.cat, who: q.who, method: q.method || 'card', inst: 1, date: today(), note: '' }); closeSheet(); render(); toast(`נשמר ${moneyT(q.amt)} ${catById(q.cat).n}`, () => { const i = S.tx.findIndex(x => x.id === r.t.id); if (i >= 0) S.tx[i] = { ...S.tx[i], deleted: true, updatedAt: nowISO() }; save(); render(); }); },
  edittx: el => { const t = S.tx.find(x => x.id === el.dataset.id); if (t) openAdd(t); },
  goleaks: () => go('leaks'), gotx: () => go('tx'), gobudget: () => go('more', 'budget'), gocash: () => go('more', 'cash'), addcash: () => openAddCash(), gocouple: () => go('more', 'couple'), gomore: () => go('more'),
  dupes: () => openDupes(), deldupe: el => { const i = S.tx.findIndex(x => x.id === el.dataset.id); if (i >= 0) { S.tx[i] = { ...S.tx[i], deleted: true, updatedAt: nowISO() }; save(); } if (findDupes().length) openDupes(); else { closeSheet(); render(); toast('נמחק, אין עוד כפילויות'); } },
  guide: () => openGuide(), installnow: () => installNow(), ioshint: () => showIosHint(), setme: el => { S.settings.me = +el.dataset.v; S.lastUsed.who = +el.dataset.v; S.settings.updatedAt = nowISO(); save(); closeSheet(); render(); toast(`הטלפון הזה של ${myName()}`); }, backup: () => openBackup(), restore: () => openRestore(), restoresnap: el => restoreSnap(el.dataset.key),
  fullcopy: async () => { const h = fullCopyHTML(); if (!h) { toast('לא זמין בדפדפן הזה'); return; } const r = await shareOrDownload(`hakesef-shelanu-${today()}.html`, h, 'text/html'); if (r === 'downloaded') toast('העותק המלא ירד למכשיר. שלחו אותו בטלגרם.'); else if (r === 'shared') toast('העותק המלא נשלח'); render(); }, settings: () => openSettings(), import: () => openImport(),
  demo: () => { makeDemo(); save(); render(); toast('נטענו נתוני דמו. אפשר למחוק ב"עוד".'); },
  cleardemo: () => { if (confirm('למחוק את נתוני הדמו? רישומים שהוספתם בעצמכם יישארו.')) { clearDemo(); go('home'); } },
  dis: el => { S.dismissed[el.dataset.k] = 1; save(); render(); },
  subflag: el => { const k = el.dataset.key, v = el.dataset.v; S.flags.sub[k] = S.flags.sub[k] === v ? null : v; save(); render(); },
  cyc: el => { const d = +el.dataset.d; const k = addM(T.key || curKey(), d); if (k <= curKey()) { T.key = k; render(); } },
  twho: el => { T.who = el.dataset.v; render(); },
  addinc: () => editIncome(), editinc: el => editIncome(el.dataset.id), addfix: () => editFixed(), editfix: el => editFixed(el.dataset.id), addlump: () => editLump(), editlump: el => editLump(el.dataset.id),
  talked: el => { const t = S.tx.find(x => x.id === el.dataset.id); if (t) { t.talked = true; t.updatedAt = nowISO(); save(); render(); } },
  meetdone: () => { const d = $('#decision'); S.meeting = { last: nowISO(), decision: d ? d.value : '' }; save(); render(); toast('נשמר. בהצלחה עם ההחלטה'); },
  impparse: () => parseImportUI(), impwho: el => { IMP.who = +el.dataset.v; $$('[data-act=impwho]').forEach(b => b.setAttribute('aria-pressed', b === el)); }, impsave: () => saveImport(),
  share: () => shareBackup(), dl: () => { downloadText(`hakesef-backup-${today()}.txt`, exportText()); if (!ART) { toast('הקובץ ירד למכשיר'); render(); } },
  copytxt: async () => { try { await navigator.clipboard.writeText(exportText()); toast('הועתק. הדביקו בהודעה לעצמכם בטלגרם'); } catch (e) { toast('ההעתקה נחסמה, השתמשו בהורדה'); } },
  loadbk: () => loadBackup(),
  report: el => { const k = el.dataset.key; if (k) { S.reportSeen = k; save(); } openReport(k || curKey()); },
  rptnav: el => { const k = addM(RK, +el.dataset.d); if (cycleKeys().includes(k) && k <= curKey()) { RK = k; drawReport(); } },
  rptshare: async () => { const r = await shareOrDownload(`hakesef-report-${RK}.html`, reportHTML(RK), 'text/html'); if (r === 'downloaded') toast('הקובץ ירד למכשיר. שלחו אותו בטלגרם.'); },
  rptprint: () => printHTML(reportHTML(RK)),
  rptcsv: async () => { const r = await shareOrDownload(`hakesef-transactions-${RK}.csv`, csvText(RK), 'text/csv'); if (r === 'downloaded') toast('הקובץ ירד למכשיר'); },
  pinsheet: () => openPinSheet(), pinkey: el => pinKey(el.dataset.k), pinoff: () => pinOff(), pinforgot: () => pinForgot(),
  obme: el => { obCollect(); OB.me = +el.dataset.v; drawOnb(); },
  obnext: () => { obCollect(); if (OB.step === 0 && !OB.n0) { toast('כתבו לפחות את השם שלכם'); return; } if (OB.step < 3) { OB.step++; drawOnb(); } else finishOnboarding(false); },
  obbackup: () => openBackup(),
  obback: () => { obCollect(); OB.step--; drawOnb(); }, obdemo: () => { obCollect(); finishOnboarding(true); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { T.q = el.value; $('#txlist').innerHTML = txListHTML(); return; }
  if (el.dataset.in && D) {
    const k = el.dataset.in;
    if (k === 'note') D.note = el.value;
    else if (k === 'split') D.split = el.value;
  }
  if (el.dataset.in && H) {
    const k = el.dataset.in;
    if (k === 'hnote') H.note = el.value; else if (k === 'hdate') H.date = el.value;
    else if (k === 'talked') D.talked = el.checked;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.in && D) { const k = el.dataset.in; if (k === 'date') { D.date = el.value || today(); } if (k === 'inst') { D.inst = +el.value; } D.more = true; drawAdd(); }
  if (el.dataset.imp && IMP) { const r = IMP[+el.dataset.i]; if (el.dataset.imp === 'on') r.on = el.checked; else r.cat = el.value; }
});

/* ================= boot ================= */
async function boot() {
  S = load();
  let rec = null; try { rec = await recoverFromMirror(); } catch (e) { }
  let emb = null; try { emb = absorbEmbedded(); } catch (e) { }
  try { await refreshSnaps(); } catch (e) { }
  $('#tabs').innerHTML = `<div class="tbar">
   <button class="tab" data-tab="home" data-act="tabhome">${I.home}בית</button>
   <button class="tab" data-tab="leaks" data-act="tableaks">${I.leak}חורים</button>
   <button id="fab" data-act="add" aria-label="הוספת הוצאה"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
   <button class="tab" data-tab="tx" data-act="tabtx">${I.list}תנועות</button>
   <button class="tab" data-tab="more" data-act="tabmore">${I.more}עוד</button></div>`;
  ACT.tabhome = () => go('home'); ACT.tableaks = () => go('leaks'); ACT.tabtx = () => go('tx'); ACT.tabmore = () => go('more');
  render();
  if (S.pin) showLock();
  else if (!S.onboarded) startOnboarding();
  else if (S.settings.me == null) setTimeout(() => openWhoAmI(true), 300);
  else setTimeout(maybeAutoReport, 400);
  if (rec && rec.restored) setTimeout(() => toast(rec.n > 0 ? `הזיכרון שוחזר מהמאגר הפנימי (${rec.n} רישומים)` : 'הזיכרון שוחזר מהמאגר הפנימי'), 600);
  else if (emb && emb.n > 0) setTimeout(() => toast(`נטענו ${emb.n} רישומים מהקובץ`), 600);
  if (!ART) detectIncognito();
  if (!S.pin) setTimeout(maybeAutoBackup, rec && rec.restored ? 3500 : 0);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  if (!ART && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
}
document.addEventListener('DOMContentLoaded', boot);
